<!doctype html>
<html lang="de">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">

  <meta name="robots" content="index,follow">
  <meta name="description" content="Stellenangebot: Mitarbeiter/in im Homeoffice deutschlandweit. Minijob mit 603 € netto Festgehalt und zusätzlicher Provision.">

  <title>Mitarbeiter/in im Homeoffice – Minijob | Homeoffice-Teilzeit</title>

  <link rel="canonical" href="https://homeoffice-teilzeit-portal.pages.dev/stellenangebot.html">
  <link rel="stylesheet" href="style.css">

  <style>
    body {
      font-family: system-ui, sans-serif;
      margin: 0;
      padding: 20px;
      color: #242424;
    }

    main {
      max-width: 850px;
      margin: 35px auto;
    }

    .job-card {
      border: 1px solid #ddd;
      border-radius: 14px;
      padding: 24px;
      background: white;
    }

    .job-card h1 {
      line-height: 1.3;
    }

    .job-description {
      line-height: 1.7;
      margin-top: 24px;
    }

    .contact-form {
      margin-top: 28px;
      padding: 20px;
      background: #faf8f3;
      border: 1px solid #e5dfd2;
      border-radius: 12px;
    }

    .contact-form label {
      display: block;
      margin: 14px 0;
      font-weight: 600;
    }

    .contact-form input,
    .contact-form textarea {
      display: block;
      box-sizing: border-box;
      width: 100%;
      padding: 12px;
      margin-top: 6px;
      border: 1px solid #ccc;
      border-radius: 7px;
      font: inherit;
    }

    .contact-form textarea {
      min-height: 130px;
    }

    button {
      padding: 12px 20px;
      border: 0;
      border-radius: 7px;
      background: #222;
      color: white;
      cursor: pointer;
      font: inherit;
    }

    button:disabled {
      opacity: .6;
    }

    .status {
      margin-top: 12px;
    }

    .back-link {
      display: inline-block;
      margin-bottom: 20px;
    }

    [hidden] {
      display: none !important;
    }
  </style>
</head>

<body>

<main>
  <a class="back-link" href="/">← Zur Startseite</a>

  <article class="job-card" id="job">
    <p>Stellenanzeige wird geladen …</p>
  </article>
</main>

<script>
const ACCESS_KEY = '22d33330-6e1b-4706-920c-6ae9ef01c109';

function esc(value) {
  return String(value || '').replace(/[&<>"']/g, c => ({
    '&': '&amp;',
    '<': '&lt;',
    '>': '&gt;',
    '"': '&quot;',
    "'": '&#39;'
  }[c]));
}

function hideEmails(value) {
  return esc(value).replace(
    /[A-Z0-9._%+-]+@[A-Z0-9.-]+\.[A-Z]{2,}/gi,
    '[E-Mail-Adresse ausgeblendet]'
  );
}

function createContactForm(title) {
  return `
    <form class="contact-form" id="application-form">
      <h2>Jetzt bewerben</h2>

      <input type="hidden" name="access_key" value="${ACCESS_KEY}">
      <input type="hidden" name="subject"
        value="${esc('Bewerbung: ' + title)}">

      <label>
        Dein Name *
        <input name="name" required maxlength="120">
      </label>

      <label>
        Deine E-Mail-Adresse *
        <input name="email" type="email" required maxlength="254">
      </label>

      <label>
        Deine Nachricht *
        <textarea name="message" required maxlength="5000"></textarea>
      </label>

      <button type="submit">Bewerbung senden</button>
      <p class="status" id="form-status" role="status"></p>
    </form>
  `;
}

async function loadJob() {
  const container = document.getElementById('job');

  try {
    const response = await fetch('/api/listings');
    const data = await response.json();

    if (!response.ok || !data.primary) {
      throw new Error('Die Stellenanzeige ist momentan nicht verfügbar.');
    }

    const job = data.primary;

    container.innerHTML = `
      <p><strong>Aktuelles Stellenangebot</strong></p>

      <h1>${esc(job.title)}</h1>

      <p>
        <strong>${esc(job.category)}</strong>
        · ${esc(job.location)}
      </p>

      <div class="job-description">
        ${hideEmails(job.description).replace(/\n/g, '<br>')}
      </div>

      ${createContactForm(job.title)}
    `;

    document.title = job.title + ' | Homeoffice-Teilzeit';

    const description = document.querySelector('meta[name="description"]');
    description.content = job.title + ' – ' +
      job.location + '. Flexible Tätigkeit im Homeoffice.';

    /* Google-Stellenanzeige automatisch aus den Daten erstellen */
    const posted = job.created_at
      ? new Date(job.created_at.replace(' ', 'T') + 'Z')
      : new Date();

    const jobPosting = {
      "@context": "https://schema.org",
      "@type": "JobPosting",
      "title": job.title,
      "description": job.description,
      "datePosted": posted.toISOString().slice(0, 10),
      "employmentType": "PART_TIME",
      "hiringOrganization": {
        "@type": "Organization",
        "name": "Lina Soung",
        "sameAs": "https://homeoffice-teilzeit-portal.pages.dev/"
      },
      "jobLocationType": "TELECOMMUTE",
      "applicantLocationRequirements": {
        "@type": "Country",
        "name": "DE"
      },
      "directApply": true
    };

    const schema = document.createElement('script');
    schema.type = 'application/ld+json';

    schema.textContent = JSON.stringify(jobPosting)
      .replace(/</g, '\\u003c');

    document.head.appendChild(schema);

  } catch (error) {
    container.innerHTML = '<p>' + esc(error.message) + '</p>';
  }
}

document.addEventListener('submit', async event => {
  if (event.target.id !== 'application-form') return;

  event.preventDefault();

  const form = event.target;
  const button = form.querySelector('button');
  const status = document.getElementById('form-status');

  button.disabled = true;
  status.textContent = 'Bewerbung wird gesendet …';

  try {
    const response = await fetch('https://api.web3forms.com/submit', {
      method: 'POST',
      body: new FormData(form)
    });

    const result = await response.json();

    if (!response.ok || !result.success) {
      throw new Error('Die Bewerbung konnte nicht gesendet werden.');
    }

    form.reset();
    status.textContent = 'Vielen Dank! Deine Bewerbung wurde gesendet.';

  } catch (error) {
    status.textContent = error.message;
  } finally {
    button.disabled = false;
  }
});

loadJob();
</script>

</body>
</html>
