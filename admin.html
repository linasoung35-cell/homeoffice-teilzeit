<!doctype html>
<html lang="de">
<head>
  <meta name="robots" content="noindex,nofollow">
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width,initial-scale=1">
  <title>Anzeigen verwalten | Admin</title>
  <link rel="stylesheet" href="style.css">

  <style>
    body {
      font-family: system-ui, sans-serif;
      padding: 24px;
    }

    .admin-wrap {
      max-width: 850px;
      margin: auto;
    }

    .admin-card {
      border: 1px solid #ddd;
      border-radius: 12px;
      padding: 18px;
      margin: 16px 0;
    }

    .admin-card button, .admin-form button {
      padding: 10px 14px;
      margin: 8px 8px 0 0;
      cursor: pointer;
    }

    .login, .admin-form {
      display: grid;
      gap: 12px;
      max-width: 600px;
    }

    input, textarea {
      box-sizing: border-box;
      width: 100%;
      padding: 12px;
      margin-top: 5px;
    }

    textarea {
      min-height: 150px;
      font: inherit;
    }

    .admin-form {
      border: 1px solid #bbb;
      border-radius: 12px;
      padding: 18px;
      margin: 18px 0;
    }

    .edit-actions {
      display: flex;
      flex-wrap: wrap;
      gap: 8px;
    }

    .search-box {
      display: flex;
      flex-wrap: wrap;
      gap: 8px;
      margin: 20px 0;
    }

    .search-box input {
      flex: 1;
      min-width: 180px;
      margin: 0;
    }

    .search-box button {
      padding: 10px 14px;
      cursor: pointer;
    }

    [hidden] {
      display: none !important;
    }
  </style>
</head>

<body>
  <main class="admin-wrap">
    <h1>Anzeige-Verwaltung</h1>

    <p>Dieser Bereich ist nur für die Website-Betreiberin.</p>

    <form id="login" class="login">
      <label>
        Admin-Passwort
        <input
          type="password"
          name="password"
          required
          autocomplete="current-password"
        >
      </label>
      <button type="submit">Anmelden</button>
    </form>

    <p id="status" role="status"></p>

    <section id="management" hidden>
      <h2>Anzeigen suchen</h2>

      <div class="search-box">
        <input
          type="search"
          id="search"
          placeholder="Titel, Kategorie, Standort oder Beschreibung ..."
          aria-label="Anzeigen durchsuchen"
        >
        <button type="button" id="resetSearch">Zurücksetzen</button>
      </div>

      <p id="resultCount"></p>
    </section>

    <section id="editor" hidden>
      <h2>Anzeige bearbeiten</h2>

      <form id="editForm" class="admin-form">
        <input type="hidden" name="id">

        <label>
          Titel
          <input name="title" required minlength="4" maxlength="100">
        </label>

        <label>
          Kategorie
          <input name="category" required maxlength="100">
        </label>

        <label>
          Standort
          <input name="location" required minlength="2" maxlength="100">
        </label>

        <label>
          Beschreibung
          <textarea name="description" required minlength="20" maxlength="5000"></textarea>
        </label>

        <label>
          E-Mail-Adresse
          <input name="email" type="email" required maxlength="254">
        </label>

        <div class="edit-actions">
          <button type="submit">Änderungen speichern</button>
          <button type="button" id="cancelEdit">Abbrechen</button>
        </div>
      </form>
    </section>

    <section id="queue"></section>

    <button id="logout" hidden>Abmelden</button>
  </main>

  <script>
    const status = document.getElementById('status');
    const queue = document.getElementById('queue');
    const login = document.getElementById('login');
    const logout = document.getElementById('logout');
    const editor = document.getElementById('editor');
    const editForm = document.getElementById('editForm');
    const management = document.getElementById('management');
    const search = document.getElementById('search');
    const resultCount = document.getElementById('resultCount');

    let items = [];

    login.addEventListener('submit', async e => {
      e.preventDefault();
      status.textContent = 'Anmeldung …';

      try {
        const r = await fetch('/api/admin/login', {
          method: 'POST',
          headers: {'Content-Type': 'application/json'},
          body: JSON.stringify({
            password: new FormData(login).get('password')
          })
        });

        const d = await r.json();
        if (!r.ok) throw Error(d.error || 'Anmeldung fehlgeschlagen');

        login.hidden = true;
        logout.hidden = false;
        management.hidden = false;
        await load();
      } catch (err) {
        status.textContent = err.message;
      }
    });

    async function load() {
      try {
        const r = await fetch('/api/admin/listings');
        const d = await r.json();

        if (!r.ok) throw Error(d.error || 'Anzeigen konnten nicht geladen werden');

        items = d.items || [];
        renderItems();

        status.textContent = '';
      } catch (e) {
        status.textContent = e.message;
      }
    }

    function renderItems() {
      const term = search.value.trim().toLocaleLowerCase('de');

      const filtered = items.filter(x => {
        const content = [
          x.title,
          x.category,
          x.location,
          x.description
        ].join(' ').toLocaleLowerCase('de');

        return content.includes(term);
      });

      resultCount.textContent =
        filtered.length + ' von ' + items.length + ' Anzeigen';

      queue.innerHTML = filtered.length
        ? filtered.map(x => `
            <article class="admin-card">
              <h2>${esc(x.title)}</h2>
              <p>${esc(x.category)} · ${esc(x.location)}</p>
              <p>${esc(x.description).replace(/\n/g, '<br>')}</p>
              <p>${esc(x.email)}</p>
              <p>Status: ${esc(x.status || 'pending')}</p>

              <button type="button" data-edit="${Number(x.id)}">
                Bearbeiten
              </button>

              ${x.status === 'pending' ? `
                <button type="button" data-id="${Number(x.id)}" data-action="approve">
                  Freigeben
                </button>
                <button type="button" data-id="${Number(x.id)}" data-action="reject">
                  Ablehnen
                </button>
              ` : `
                <button
                  type="button"
                  data-id="${Number(x.id)}"
                  data-action="delete"
                  style="background:#b91c1c;color:white"
                >
                  Löschen
                </button>
              `}
            </article>
          `).join('')
        : '<p>Keine passenden Anzeigen gefunden.</p>';
    }

    search.addEventListener('input', renderItems);

    document.getElementById('resetSearch').addEventListener('click', () => {
      search.value = '';
      renderItems();
      search.focus();
    });

    queue.addEventListener('click', async e => {
      const editButton = e.target.closest('button[data-edit]');

      if (editButton) {
        const item = items.find(x => Number(x.id) === Number(editButton.dataset.edit));
        if (!item) return;

        editForm.elements.id.value = item.id;
        editForm.elements.title.value = item.title || '';
        editForm.elements.category.value = item.category || '';
        editForm.elements.location.value = item.location || '';
        editForm.elements.description.value = item.description || '';
        editForm.elements.email.value = item.email || '';

        editor.hidden = false;
        editor.scrollIntoView({behavior: 'smooth'});
        return;
      }

      const b = e.target.closest('button[data-id]');
      if (!b) return;

      if (b.dataset.action === 'delete') {
        if (!confirm('Möchtest du diese Anzeige wirklich dauerhaft löschen?')) {
          return;
        }
      }

      b.disabled = true;

      try {
        const r = await fetch('/api/admin/decision', {
          method: 'POST',
          headers: {'Content-Type': 'application/json'},
          body: JSON.stringify({
            id: Number(b.dataset.id),
            action: b.dataset.action
          })
        });

        const d = await r.json();
        if (!r.ok) throw Error(d.error || 'Aktion fehlgeschlagen');

        await load();
      } catch (err) {
        status.textContent = err.message;
        b.disabled = false;
      }
    });

    editForm.addEventListener('submit', async e => {
      e.preventDefault();
      status.textContent = 'Änderungen werden gespeichert …';

      const data = Object.fromEntries(new FormData(editForm).entries());
      data.id = Number(data.id);

      try {
        const r = await fetch('/api/admin/edit', {
          method: 'POST',
          headers: {'Content-Type': 'application/json'},
          body: JSON.stringify(data)
        });

        const d = await r.json();
        if (!r.ok) throw Error(d.error || 'Speichern fehlgeschlagen');

        editor.hidden = true;
        editForm.reset();
        status.textContent = 'Änderungen erfolgreich gespeichert.';
        await load();
      } catch (err) {
        status.textContent = err.message;
      }
    });

    document.getElementById('cancelEdit').addEventListener('click', () => {
      editor.hidden = true;
      editForm.reset();
    });

    logout.addEventListener('click', async () => {
      await fetch('/api/admin/logout', {method: 'POST'});
      login.hidden = false;
      logout.hidden = true;
      management.hidden = true;
      editor.hidden = true;
      queue.innerHTML = '';
      items = [];
      search.value = '';
      resultCount.textContent = '';
      status.textContent = 'Abgemeldet.';
    });

    function esc(v) {
      return String(v || '').replace(/[&<>"']/g, c => ({
        '&': '&amp;',
        '<': '&lt;',
        '>': '&gt;',
        '"': '&quot;',
        "'": '&#39;'
      }[c]));
    }
  </script>
</body>
</html>
